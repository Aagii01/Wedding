<!doctype html>
<!-- HERO (нүүр зураг) дээрх нэрийн PNG загвар. Өөрчлөх зүйл: доорх data-fit span-ууд дахь нэр.
     Хэмжээ: canvas 1170px = утасны 390px × 3. Дотоод хайрцаг 1026px = (390 − 24×2) × 3.
     max 288px = Template14 hero-гийн 96px × 3; "&" нэрийн 0.5; цагаан + сүүдэр (hero-гийн textShadow × 3).
     fit 0.90 — татлага (swash) хайрцгаас гарч болох тул 96% биш 90% ашиглана. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'NameFont';src:url('champion.woff2') format('woff2')}
html,body{margin:0;background:transparent}
.vp{width:1170px;padding:60px 72px;box-sizing:border-box;text-align:center}
.names{font-family:'NameFont',cursive;color:#fff;width:100%;line-height:1.08;text-shadow:0 6px 66px rgba(0,0,0,.55)}
.names span.l{display:block}
.names .amp{display:block;color:rgba(255,255,255,.9);margin:6px 0}
.names [data-fit]{display:inline-block;white-space:nowrap}
</style></head><body><div class="vp"><div class="names" id="w">
<span class="l"><span data-fit>Б.Хосбаяр</span></span>
<span class="l"><span class="amp" id="amp">&amp;</span><span data-fit>Ч.Цэрэнчимэд</span></span>
</div></div><script>
// Template14-ийн useFitText-тэй ижил логик: хамгийн урт мөрийг хайрцагт багтаах хэмжээг олно
function fit(){const w=document.getElementById('w');const avail=w.clientWidth*0.90;const max=288,min=90;
const sp=[...w.querySelectorAll('[data-fit]')];sp.forEach(s=>s.style.fontSize=max+'px');
const widest=Math.max(...sp.map(s=>s.scrollWidth));const next=widest>avail?Math.max(min,Math.floor(max*avail/widest)):max;
sp.forEach(s=>s.style.fontSize=next+'px');document.getElementById('amp').style.fontSize=Math.max(60,Math.round(next*0.5))+'px';}
fit();document.fonts.ready.then(fit);
</script></body></html>
